name: Feature request
description: 提议与课程资料扫描或下载直接相关的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: 权限与合规边界
      description: 说明是否需要新的站点权限；不接受 Cookie 导出、验证码绕过或 DRM 解密需求。
